name: ODMM cumulative source ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package tracked files from this exact commit
        run: |
          mkdir -p dist
          python 09-Tools/BUILD-DELIVERY-ZIP.py --output dist/ODMM-Cumulative-${GITHUB_SHA}.zip
      - name: Verify archive and commit provenance
        run: |
          python 09-Tools/VERIFY-DELIVERY-MANIFEST.py "dist/ODMM-Cumulative-${GITHUB_SHA}.zip"
          python - <<'PY'
          import json, os, zipfile
          path=f"dist/ODMM-Cumulative-{os.environ['GITHUB_SHA']}.zip"
          with zipfile.ZipFile(path) as z:
              manifest=json.loads(z.read("DELIVERY-MANIFEST.json"))
          assert manifest["source_commit"] == os.environ["GITHUB_SHA"]
          assert manifest["source_type"] == "git-checkout"
          print("PASS: ZIP corresponds to GitHub Actions commit")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ODMM-Cumulative-Source-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
