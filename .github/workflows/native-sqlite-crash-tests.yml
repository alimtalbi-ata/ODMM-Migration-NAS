name: ODMM native SQLite crash recovery
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  crash-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Crash-before and crash-after commit regression
        env:
          PYTHONPATH: 02-Sources
        run: python -m unittest discover -s 02-Sources -p 'test_native_sqlite_commit_crash_v22831.py' -v
