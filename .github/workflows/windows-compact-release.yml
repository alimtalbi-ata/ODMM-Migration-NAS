name: ODMM Windows Compact native build V228.86
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: odmm-windows-compact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Headless UI and presentation regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s 09-Tools -p "test_windows_*.py" -v
          python -m unittest discover -s 09-Tools -p "test_sqlite_registry_contract.py" -v
      - name: Adversarial ZIP manifest security tests
        shell: pwsh
        run: python -m unittest discover -s 09-Tools -p "test_delivery_manifest_security.py" -v
      - name: Verify version and release contract
        shell: pwsh
        run: python 03-Build-Installation/CHECK-WINDOWS-RELEASE-CONTRACT.py
      - name: Record Windows runner environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binary | Out-Null
          [ordered]@{os=[Environment]::OSVersion.VersionString; architecture=$env:PROCESSOR_ARCHITECTURE; python=(python --version 2>&1 | Out-String).Trim(); run_id=$env:GITHUB_RUN_ID; commit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content binary/WINDOWS-RUNNER-INFO.json
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'ISCC.exe missing' }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Preserve Windows runner provenance across atomic binary publication
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 03-Build-Installation | Out-Null
          Copy-Item binary/WINDOWS-RUNNER-INFO.json 03-Build-Installation/WINDOWS-RUNNER-INFO.json -Force
      - name: Compile portable and installer
        shell: cmd
        run: call 03-Build-Installation\BUILD-WINDOWS-COMPACT.cmd
      - name: Restore Windows runner provenance after atomic publication
        shell: pwsh
        run: |
          Copy-Item 03-Build-Installation/WINDOWS-RUNNER-INFO.json binary/WINDOWS-RUNNER-INFO.json -Force
      - name: Verify published release
        shell: pwsh
        run: |
          python 03-Build-Installation/VALIDATE-WINDOWS-RELEASE.py binary
          if (!(Test-Path binary/portable/ODMM-Compact.exe)) { throw 'Portable missing' }
          if (!(Test-Path binary/installer/ODMM-Compact-Setup-V7.9.31.exe)) { throw 'Installer missing' }
      - name: Verify bundled Tcl/Tk runtime self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'binary/portable/ODMM-Compact.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test-tk' -PassThru
          try {
            if (!$proc.WaitForExit(30000)) { throw 'Tk runtime self-test timed out' }
            if ($proc.ExitCode -ne 0) { throw "Bundled Tcl/Tk failed initialization (exit $($proc.ExitCode))" }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Smoke test portable GUI startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'binary/portable/ODMM-Compact.exe').Path
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $proc.Refresh()
            if ($proc.HasExited) { throw "Portable exited unexpectedly: $($proc.ExitCode)" }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Smoke test standalone executable outside source tree
        shell: pwsh
        run: ./03-Build-Installation/TEST-WINDOWS-STANDALONE.ps1
      - name: Smoke test silent install and uninstall
        shell: pwsh
        run: |
          ./03-Build-Installation/TEST-WINDOWS-INSTALL.ps1 -Version '7.9.31'
      - name: Verify smoke test report
        shell: pwsh
        run: |
          $report = Get-Content binary/WINDOWS-INSTALL-SMOKE.json -Raw | ConvertFrom-Json
          if (!$report.passed -or !$report.installed -or !$report.uninstalled) { throw "Installation smoke test not qualified" }
      - name: Verify release evidence before packaging
        shell: pwsh
        run: |
          python 03-Build-Installation/VALIDATE-WINDOWS-RELEASE.py binary
          $report = Get-Content binary/WINDOWS-INSTALL-SMOKE.json -Raw | ConvertFrom-Json
          if (!$report.passed -or !$report.installed -or !$report.uninstalled) { throw 'Missing passing install/uninstall evidence' }
          if (!(Test-Path binary/WINDOWS-RUNNER-INFO.json)) { throw 'Missing runner provenance' }
      - name: Package qualified Windows cumulative ZIP
        shell: pwsh
        run: |
          python 03-Build-Installation/PACKAGE-WINDOWS-RELEASE.py --root . --output ODMM-V228.86-Windows-Qualified-Cumulative.zip
      - name: Verify cumulative ZIP manifest and source commit
        shell: pwsh
        run: |
          python 09-Tools/VERIFY-DELIVERY-MANIFEST.py ODMM-V228.86-Windows-Qualified-Cumulative.zip
          python -c "import json,os,zipfile; z=zipfile.ZipFile('ODMM-V228.86-Windows-Qualified-Cumulative.zip'); m=json.loads(z.read('DELIVERY-MANIFEST.json')); assert m['source_commit']==os.environ['GITHUB_SHA']; assert m['source_type']=='windows-qualified-git-checkout'; assert 'binary/portable/ODMM-Compact.exe' in m['files']; print('PASS|windows-binaries-commit-provenance')"
      - name: Upload qualified cumulative ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ODMM-V228.86-Windows-qualified-cumulative
          path: ODMM-V228.86-Windows-Qualified-Cumulative.zip
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ODMM-V228.86-Windows-failure-evidence
          path: |
            binary/WINDOWS-INSTALL-SMOKE.json
            binary/WINDOWS-RUNNER-INFO.json
            03-Build-Installation/WINDOWS-TOOLCHAIN-REPORT.json
          if-no-files-found: warn
      - name: Upload native Windows binaries and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ODMM-V228.86-Windows-binary
          path: |
            binary/
            03-Build-Installation/WINDOWS-TOOLCHAIN-REPORT.json
          if-no-files-found: error
