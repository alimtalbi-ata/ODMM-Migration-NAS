name: ODMM Windows Compact native build V228.74
on:
  workflow_dispatch:
  push:
    paths:
      - '02-Sources/**'
      - '03-Build-Installation/**'
      - '.github/workflows/windows-compact-release.yml'
concurrency:
  group: odmm-windows-compact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Record Windows runner environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binary | Out-Null
          [ordered]@{os=[Environment]::OSVersion.VersionString; architecture=$env:PROCESSOR_ARCHITECTURE; python=(python --version 2>&1 | Out-String).Trim(); run_id=$env:GITHUB_RUN_ID; commit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content binary/WINDOWS-RUNNER-INFO.json
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'ISCC.exe missing' }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Compile portable and installer
        shell: cmd
        run: call 03-Build-Installation\BUILD-WINDOWS-COMPACT.cmd
      - name: Verify published release
        shell: pwsh
        run: |
          python 03-Build-Installation/VALIDATE-WINDOWS-RELEASE.py binary
          if (!(Test-Path binary/portable/ODMM-Compact.exe)) { throw 'Portable missing' }
          if (!(Test-Path binary/installer/ODMM-Compact-Setup-V7.9.29.exe)) { throw 'Installer missing' }
      - name: Smoke test portable GUI startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'binary/portable/ODMM-Compact.exe').Path
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $proc.Refresh()
            if ($proc.HasExited) { throw "Portable exited unexpectedly: $($proc.ExitCode)" }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Smoke test silent install and uninstall
        shell: pwsh
        run: |
          ./03-Build-Installation/TEST-WINDOWS-INSTALL.ps1 -Version '7.9.29'
      - name: Verify smoke test report
        shell: pwsh
        run: |
          $report = Get-Content binary/WINDOWS-INSTALL-SMOKE.json -Raw | ConvertFrom-Json
          if (!$report.passed -or !$report.installed -or !$report.uninstalled) { throw "Installation smoke test not qualified" }
      - name: Package qualified Windows cumulative ZIP
        shell: pwsh
        run: |
          python 03-Build-Installation/PACKAGE-WINDOWS-RELEASE.py --root . --output ODMM-V228.74-Windows-Qualified-Cumulative.zip
      - name: Upload qualified cumulative ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ODMM-V228.74-Windows-qualified-cumulative
          path: ODMM-V228.74-Windows-Qualified-Cumulative.zip
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ODMM-V228.74-Windows-failure-evidence
          path: |
            binary/WINDOWS-INSTALL-SMOKE.json
            binary/WINDOWS-RUNNER-INFO.json
            03-Build-Installation/WINDOWS-TOOLCHAIN-REPORT.json
          if-no-files-found: warn
      - name: Upload native Windows binaries and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ODMM-V228.74-Windows-binary
          path: |
            binary/
            03-Build-Installation/WINDOWS-TOOLCHAIN-REPORT.json
          if-no-files-found: error
