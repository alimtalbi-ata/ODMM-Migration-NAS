# LAB ONLY: Keycloak dev mode; TLS termination loopback-only.
services:
  keycloak:
    command: ["start-dev", "--import-realm", "--http-enabled=true", "--hostname=https://localhost:8443", "--hostname-strict=true"]
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
  oidc_tls:
    image: ${NGINX_IMAGE:?Provide reviewed nginx image@sha256 digest}
    depends_on: [keycloak]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx-keycloak.conf:/etc/nginx/conf.d/default.conf:ro
      - ${OIDC_TLS_CERT_DIR:?Set cert directory}:/etc/odmm/tls:ro
    networks: [oidc_lab]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
