# ISOLATED TEST LAB ONLY. No host port exposed for Keycloak.
# Set KEYCLOAK_IMAGE to an operator-approved immutable digest.
services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:?Set approved image digest}
    command: ["start-dev", "--http-enabled=true", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?Set admin user}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set strong admin password}
    networks: [oidc_lab]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
networks:
  oidc_lab:
    internal: true
